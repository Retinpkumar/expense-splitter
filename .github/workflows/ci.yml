name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.29"
      - run: uv sync
      - run: uv run pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "exists=$([ -d frontend ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
      - if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm install
      - if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint
      - if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
